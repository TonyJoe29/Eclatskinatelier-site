name = "eclatskinatelier-telegram-bot"
main = "src/worker.js"
compatibility_date = "2026-05-25"
workers_dev = true

kv_namespaces = [
  { binding = "OFFERS_KV", id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]

[vars]
AMAZON_ASSOCIATE_TAG = "luxeskinateli-20"
POST_LANGUAGE = "en"
MIN_DISCOUNT_PERCENT = "5"
MIN_REVIEW_COUNT = "1000"
MIN_RATING = "4"
