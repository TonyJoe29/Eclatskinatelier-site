name = "eclatskinatelier-telegram-bot"
main = "src/worker.js"
compatibility_date = "2026-05-25"
workers_dev = true
preview_urls = false

kv_namespaces = [
  { binding = "OFFERS_KV", id = "2da3142193a24db1827652f932a57e01" }
]

[vars]
AMAZON_ASSOCIATE_TAG = "luxeskinateli-20"
POST_LANGUAGE = "en"
MIN_DISCOUNT_PERCENT = "5"
MIN_REVIEW_COUNT = "1000"
MIN_RATING = "4"
SCAN_ENABLED = "true"
MAX_SCAN_CANDIDATES = "5"

[triggers]
crons = ["*/30 * * * *"]
